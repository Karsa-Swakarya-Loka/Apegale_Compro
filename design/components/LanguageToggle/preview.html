<!doctype html>
<html lang="id" data-theme="light">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<meta charset="utf-8"><title>LanguageToggle — preview</title>
<style>body{margin:0;padding:24px;background:var(--surface);}</style></head>
<body>
<div class="ag">
<div class="ag-row">
  <div class="ag-lang" role="group" aria-label="Pilih bahasa">
    <button type="button" data-lang="id" aria-pressed="true">ID</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <p id="lang-sample" class="body" style="color:var(--ink-muted)">Mitra Anda untuk urusan imigrasi &amp; ekspatriat.</p>
</div>
<div style="margin-top:16px;background:var(--maroon-deep);padding:12px 16px;border-radius:var(--radius-md);display:inline-block">
  <div class="ag-lang ag-lang--on-dark" role="group" aria-label="Pilih bahasa (latar gelap)">
    <button type="button" aria-pressed="true">ID</button>
    <button type="button" aria-pressed="false">EN</button>
  </div>
</div>
</div>
<script>
var copy = { id: 'Mitra Anda untuk urusan imigrasi & ekspatriat.', en: 'Your partner for immigration & expatriate.' };
document.querySelectorAll('.ag-lang').forEach(function (group) {
  group.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    group.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    var lang = b.dataset.lang; if (!lang) return;
    document.getElementById('lang-sample').textContent = copy[lang];
    document.documentElement.lang = lang;
    try { localStorage.setItem('apegale-language', lang); } catch (err) {}
  });
});
</script>
</body>
</html>
